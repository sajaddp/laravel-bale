site_name: "لاراول بله — مستندات رابط برنامه‌نویسی بازوی بله"
site_url: "https://sajaddehshiri.ir/laravel-bale/"
site_description: "مستندات فارسی لاراول بله برای کار با رابط برنامه‌نویسی بازوی بله در لاراول ۱۳ و پی‌اچ‌پی ۸٫۳ یا جدیدتر"
site_author: "سجاد دهشیری"
repo_url: "https://github.com/sajaddp/laravel-bale"
repo_name: "sajaddp/laravel-bale"
edit_uri: "edit/main/docs/"
use_directory_urls: true

theme:
  name: material
  language: fa
  direction: rtl
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: استفاده از حالت تیره
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: استفاده از حالت روشن

plugins:
  - search

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      permalink_title: پیوند پایدار
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

copyright: "لاراول بله · <a href=\"https://github.com/sajaddp/laravel-bale\">گیت‌هاب</a> · <a href=\"https://github.com/sajaddp/laravel-bale/blob/main/LICENSE\">مجوز ام‌آی‌تی</a>"

nav:
  - خانه: index.md
  - شروع:
      - شروع سریع: getting-started.md
      - پیام‌ها: messages.md
  - راهنماها:
      - وب‌هوک: webhooks.md
      - دریافت دوره‌ای: polling.md
      - فایل و رسانه: files-media.md
      - دکمه‌ها و پاسخ انتخاب: callbacks-keyboards.md
      - آزمون: testing.md
      - دستورپخت‌ها: recipes.md
  - مرجع:
      - مرجع رابط برنامه‌نویسی: api-reference.md
      - پوشش رابط برنامه‌نویسی بله: api-coverage.md
      - رفع اشکال: troubleshooting.md
  - راهنمای هوش مصنوعی: ai-coding.md
  - پروژه:
      - مخزن گیت‌هاب: https://github.com/sajaddp/laravel-bale
